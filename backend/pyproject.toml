[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soyounglee", email = "sensibly00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=2.3.0",
    "boto3>=1.43.119",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "fpdf2>=2.9.0",
    "imageio-ffmpeg>=0.6.0",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "numpy>=2.4",
    "openai>=3.36.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[server]>=5.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
worker = [
    "httpx>=0.28.1",
    "openai-whisper>=20250625",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
]

# 말모아: worker = Mac 작업자 전용 (Whisper 음성 변환, Apple Vision 글자 인식). 개발 Mac 의 uv sync 에는 들어가고,
# 배포 서버(Linux Docker)에서는 빼야 한다 — Dockerfile 의 uv sync 에 --no-group worker (통합 단계 6)
[tool.uv]
default-groups = ["dev", "worker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI의 Depends(), Cookie() 등을 함수 기본값에 쓰는 것은 FastAPI의 정식 사용법입니다
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]
